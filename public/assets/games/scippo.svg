  <g transform="translate(320 382)" text-anchor="middle">
    <text font-family="Bangers, Impact, sans-serif" font-size="46" fill="#f6edd9" letter-spacing="4">SCIPPO!</text>
    <text y="20" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#b4a4c2" letter-spacing="4">20 CARTE · 5 MINUTI</text>
