<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Tre carte di SCIPPO: botta, finta e jolly">
  <defs>
    <radialGradient id="bg" cx="50%" cy="102%" r="90%">
      <stop offset="0" stop-color="#4b2b5d"/>
      <stop offset="1" stop-color="#150e1d"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ab4"/><stop offset="1" stop-color="#e32163"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd7ff"/><stop offset="1" stop-color="#8a45cc"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ffb4"/><stop offset="1" stop-color="#b7e01c"/>
    </linearGradient>
    <pattern id="stripes" width="18" height="18" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#1b1224"/>
      <rect width="9" height="18" fill="#271a32"/>
    </pattern>
  </defs>
  <rect width="640" height="420" fill="url(#bg)"/>
  <g stroke="#d9ff3f" stroke-opacity=".28" fill="none" stroke-width="2">
    <path d="M70 320c-22-58 6-130 74-158s150-6 186 42c28 37 6 79-34 84s-62-29-41-56 60-17 78 14"/>
    <circle cx="532" cy="86" r="46" stroke-dasharray="7 9"/>
  </g>
  <g transform="translate(320 224)">
    <g transform="rotate(-16) translate(-190 14)">
      <rect x="-60" y="-84" width="120" height="172" rx="14" fill="url(#pink)" stroke="#08060c" stroke-width="6"/>
      <rect x="-51" y="-75" width="102" height="154" rx="9" fill="none" stroke="#14110a" stroke-opacity=".3" stroke-width="3"/>
      <text x="0" y="-16" text-anchor="middle" font-family="Arial, sans-serif" font-size="52">👊</text>
      <text x="0" y="30" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="34" fill="#14110a" letter-spacing="2">BOTTA</text>
      <text x="0" y="52" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="700" font-size="13" fill="#14110a" opacity=".7">BATTE LA FINTA</text>
    </g>
    <g transform="rotate(-2) translate(-60 -10)">
      <rect x="-62" y="-88" width="124" height="176" rx="14" fill="url(#violet)" stroke="#08060c" stroke-width="6"/>
      <rect x="-52" y="-78" width="104" height="156" rx="9" fill="none" stroke="#14110a" stroke-opacity=".3" stroke-width="3"/>
      <text x="0" y="-18" text-anchor="middle" font-family="Arial, sans-serif" font-size="54">🎭</text>
      <text x="0" y="30" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="34" fill="#14110a" letter-spacing="2">FINTA</text>
      <text x="0" y="52" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="700" font-size="13" fill="#14110a" opacity=".7">BATTE LO SCUDO</text>
    </g>
    <g transform="rotate(15) translate(78 18)">
