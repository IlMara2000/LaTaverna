      <text x="0" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="50">🃏</text>
      <text x="0" y="32" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="36" fill="#14110a" letter-spacing="2">JOLLY</text>
      <text x="0" y="53" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="700" font-size="13" fill="#14110a" opacity=".7">BATTE TUTTO</text>
