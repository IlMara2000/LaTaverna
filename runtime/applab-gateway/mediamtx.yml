# mediamtx — solo quello che serve ad APP LAB.
# Pubblicazione: ffmpeg invia il flusso H.264 dell'emulatore in WHIP su
#   http://127.0.0.1:8889/applab/whip
# Lettura: il gateway inoltra l'offerta WebRTC a http://127.0.0.1:8889/applab/whep
# RTSP resta disattivato: la porta 8554 è già occupata dall'emulatore Android.
logLevel: info
rtsp: no
rtmp: no
hls: no
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: 127.0.0.1:8189
srt: no
api: no
paths:
  applab:
    source: publisher
