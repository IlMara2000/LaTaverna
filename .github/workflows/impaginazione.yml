name: Impaginazione

# Ogni push e ogni pull request misurano la scheda carta Magic a otto larghezze
# e la safe-area del segnapunti. I test si accendono da soli un Vite temporaneo
# quando la porta non serve i sorgenti, quindi in CI non serve né un server
# statico né una build: girano direttamente sui sorgenti.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Un push nuovo o un aggiornamento della PR rende inutile la misura precedente.
  group: impaginazione-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scheda-carta:
    name: Scheda carta e safe-area del segnapunti
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Dipendenze del progetto
        run: npm ci

      # agent-browser scarica Chrome for Testing (194 MB) in questa cartella:
      # conservarla evita il download a ogni push.
      - name: Chrome di agent-browser
        id: chrome
        uses: actions/cache@v4
        with:
          path: ~/.agent-browser/browsers
          key: agent-browser-browsers-${{ runner.os }}-v1

      - name: agent-browser
        run: |
          npm install --global agent-browser
          node --version
          agent-browser --version

      # Con la cache piena il browser c'è già: basta verificarlo, senza apt
      # (--with-deps serve solo a scaricare Chrome e le sue librerie di sistema).
      - name: Chrome for Testing
        run: |
          if [ -n "$(ls -d "$HOME"/.agent-browser/browsers/chrome-*/ 2>/dev/null)" ]; then
            echo "Chrome già presente: verifico l'installazione"
            agent-browser install
          else
            echo "Chrome assente: scarico browser e dipendenze"
            agent-browser install --with-deps
          fi

      # Il test di impaginazione gira sui sorgenti, non sulla build, quindi una push
      # che rompe il bundling o i test unitari passerebbe inosservata: li eseguo
      # prima, quando sono ancora veloci.
      - name: Build
        run: npm run build

      - name: Test rapidi
        run: npm run test:cards

      - name: Misura l'impaginazione
        run: npm run test:layout

      # Barra e menu del segnapunti dentro gli inset di sei telefoni, per 2–6
      # giocatori. Anche questo test si accende un Vite temporaneo da solo.
      - name: Safe-area del segnapunti
        run: npm run test:safe-area

      - name: Log del test
        if: failure()
        run: |
          echo "Il test stampa la tabella su stdout: le righe con le misure sono qui sopra."
          agent-browser close --all || true
